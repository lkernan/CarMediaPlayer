// Builds and tests the app's sources (../../app/src/main) with the same
// plugins, SDK levels and dependencies as app/build.gradle, plus the
// Robolectric tests in ../tests.  Release APKs from here come out unsigned:
// sign them with the platform key (see CLAUDE.md at the repo root).
// versionCode / versionName must match app/build.gradle.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
def SRC = new File(rootDir, '../../app/src/main').canonicalPath
// The SAIC launcher's own code, for LauncherWheelTest: converted from the head
// unit's firmware when FIRMWARE_LAUNCHER_APK points at its Launcher APK.  It's
// SAIC's, so it never goes in the repo (see tools/firmware/README.md).
def launcherApk = System.getenv('FIRMWARE_LAUNCHER_APK')
def launcherJar = layout.buildDirectory.file('launcher/launcher.jar')
android {
    namespace 'com.saicmotor.media'
    compileSdk 34
    defaultConfig { applicationId "com.saicmotor.media"; minSdk 27; targetSdk 28; versionCode 2000000029; versionName "1.0.11" }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    kotlinOptions { jvmTarget = '1.8' }
    buildFeatures { viewBinding true }
    lint { abortOnError false; checkReleaseBuilds false }
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                systemProperty 'robolectric.dependency.repo.url', 'https://maven-central.storage-download.googleapis.com/maven2/'
                systemProperty 'roborazzi.test.record', 'true'
                maxHeapSize = '3g'
                if (launcherApk) {
                    dependsOn 'launcherJar'
                    systemProperty 'launcher.jar', launcherJar.get().asFile.path
                }
            }
        }
    }
    sourceSets {
        main { manifest.srcFile "$SRC/AndroidManifest.xml"; java.srcDirs = ["$SRC/java"]; res.srcDirs = ["$SRC/res"] }
        test { java.srcDirs = [new File(rootDir, 'tests').canonicalPath] }
    }
}
dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.media:media:1.7.0"
    implementation "androidx.media3:media3-exoplayer:1.3.1"
    implementation "androidx.media3:media3-datasource:1.3.1"
    implementation "androidx.media3:media3-database:1.3.1"
    implementation "io.coil-kt:coil:2.6.0"
    implementation "androidx.fragment:fragment-ktx:1.6.2"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"
    implementation "androidx.palette:palette-ktx:1.0.0"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.11.1"
    testImplementation "androidx.test:core:1.5.0"
    testImplementation "androidx.test.ext:junit:1.1.5"
    testImplementation "io.github.takahirom.roborazzi:roborazzi:1.8.0"
}

configurations { dex2jar }
dependencies { dex2jar "de.femtopedia.dex2jar:dex-tools:2.4.38" }
tasks.register('launcherJar', JavaExec) {
    onlyIf { launcherApk }
    classpath = configurations.dex2jar
    mainClass = 'com.googlecode.dex2jar.tools.Dex2jarCmd'
    args '--force', '--output', launcherJar.get().asFile.path, launcherApk ?: 'none'
    inputs.property 'apk', launcherApk ?: ''
    outputs.file launcherJar
}
